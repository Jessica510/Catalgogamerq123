<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo Adaptable de Productos Gamer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h1 class="text-center text-uppercase mb-4">Catálogo de Productos Gamer</h1>

    <div class="row g-4">
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card text-center h-100">
          <div class="card-body">
            <h5 class="card-title">Mouse RGB</h5>
            <p class="card-text text-success fw-bold fs-5">$45.00</p>
            <button class="btn btn-outline-dark w-100">Comprar</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card text-center h-100">
          <div class="card-body">
            <h5 class="card-title">Teclado Meca</h5>
            <p class="card-text text-success fw-bold fs-5">$85.00</p>
            <button class="btn btn-outline-dark w-100">Comprar</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card text-center h-100">
          <div class="card-body">
            <h5 class="card-title">Headset 7.1</h5>
            <p class="card-text text-success fw-bold fs-5">$60.00</p>
            <button class="btn btn-outline-dark w-100">Comprar</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-3">
        <div class="card text-center h-100">
          <div class="card-body">
            <h5 class="card-title">Silla Gamer</h5>
            <p class="card-text text-success fw-bold fs-5">$199.00</p>
            <button class="btn btn-outline-dark w-100">Comprar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
